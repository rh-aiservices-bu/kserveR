apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: iris-rf
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    labels:
      app.openshift.io/runtime: r
      app.openshift.io/runtime-version: "4.4.2"
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: R
      runtime: kserve-r-runtime
      storageUri: oci://quay.io/sara_banderby/kserver:test
      env:
        - name: MODEL_NAME
          value: iris-rf
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
