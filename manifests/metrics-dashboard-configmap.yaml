apiVersion: v1
kind: ConfigMap
metadata:
  name: iris-rf-metrics-dashboard
  namespace: kserver
data:
  supported: "true"
  metrics: |
    {
      "config": [
        {
          "title": "Requests per 5 minutes",
          "type": "REQUEST_COUNT",
          "queries": [
            {
              "title": "Number of successful incoming requests",
              "query": "round(sum(increase(model_infer_request_success_total{namespace='kserver', pod=~'iris-rf-predictor-.*'}[5m])))"
            },
            {
              "title": "Number of failed incoming requests",
              "query": "round(sum(increase(model_infer_request_failure_total{namespace='kserver', pod=~'iris-rf-predictor-.*'}[5m])))"
            }
          ]
        },
        {
          "title": "Average response time (ms)",
          "type": "MEAN_LATENCY",
          "queries": [
            {
              "title": "Average inference latency",
              "query": "sum by (pod) (rate(model_infer_request_duration_sum{namespace='kserver', pod=~'iris-rf-predictor-.*'}[1m])) / sum by (pod) (rate(model_infer_request_duration_count{namespace='kserver', pod=~'iris-rf-predictor-.*'}[1m]))"
            },
            {
              "title": "Average e2e latency",
              "query": "sum by (pod) (rate(rest_server_request_duration_seconds_sum{namespace='kserver', pod=~'iris-rf-predictor-.*', path='/v2/models/{model_name}/infer'}[1m])) / sum by (pod) (rate(rest_server_request_duration_seconds_count{namespace='kserver', pod=~'iris-rf-predictor-.*', path='/v2/models/{model_name}/infer'}[1m]))"
            }
          ]
        },
        {
          "title": "CPU utilization %",
          "type": "CPU_USAGE",
          "queries": [
            {
              "title": "CPU usage",
              "query": "sum(pod:container_cpu_usage:sum{namespace='kserver', pod=~'iris-rf-predictor-.*'})/sum(kube_pod_resource_limit{resource='cpu', pod=~'iris-rf-predictor-.*', namespace='kserver'})"
            }
          ]
        },
        {
          "title": "Memory utilization %",
          "type": "MEMORY_USAGE",
          "queries": [
            {
              "title": "Memory usage",
              "query": "sum(container_memory_working_set_bytes{namespace='kserver', pod=~'iris-rf-predictor-.*'})/sum(kube_pod_resource_limit{resource='memory', pod=~'iris-rf-predictor-.*', namespace='kserver'})"
            }
          ]
        }
      ]
    }
