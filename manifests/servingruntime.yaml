apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: kserve-r-runtime
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "R (RDS / qs2 / RData)"
    opendatahub.io/modelServingSupport: '["single"]'
    opendatahub.io/apiProtocol: "REST"
spec:
  supportedModelFormats:
    - name: r
      version: "1"
      autoSelect: true
      priority: 1

  protocolVersions:
    - v2
  multiModel: false

  containers:
    - name: kserve-container
      image: quay.io/sara_banderby/kserver:latest
      imagePullPolicy: Always

      ports:
        - containerPort: 8080
          protocol: TCP

      env:
        - name: MODEL_DIR
          value: /mnt/models
        # - name: MODEL_FORMAT
        #   value: vetiver
        # - name: MODEL_OBJECT
        #   value: fit
        # - name: MODEL_PACKAGES
        #   value: caret

      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
      startupProbe:
        httpGet:
          path: /v2/health/ready
          port: 8080
        periodSeconds: 10
        failureThreshold: 60

      readinessProbe:
        httpGet:
          path: /v2/health/ready
          port: 8080
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /v2/health/live
          port: 8080
        periodSeconds: 20
