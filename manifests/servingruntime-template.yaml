apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: kserve-r-runtime-ubi9-template
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/apiProtocol: "REST"
    opendatahub.io/modelServingSupport: '["single"]'
    opendatahub.io/model-type: '["predictive"]'
    openshift.io/display-name: "R (RDS / qs2 / RData)"
    openshift.io/provider-display-name: "kserveR"
    description: "Serves models fitted in R over the V2 Open Inference Protocol."
    tags: "rhods,rhoai,kserve,servingruntime,r"
objects:
  - apiVersion: serving.kserve.io/v1alpha1
    kind: ServingRuntime
    metadata:
      name: kserve-r-runtime-ubi9
      labels:
        opendatahub.io/dashboard: "true"
      annotations:
        openshift.io/display-name: "R (RDS / qs2 / RData)"
        opendatahub.io/template-name: kserve-r-runtime-ubi9-template
        opendatahub.io/template-display-name: "R (RDS / qs2 / RData)"
        opendatahub.io/modelServingSupport: '["single"]'
        opendatahub.io/apiProtocol: "REST"
    spec:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      supportedModelFormats:
        - name: R
          version: "1"
          autoSelect: true
          priority: 1
      protocolVersions:
        - v2
      multiModel: false
      containers:
        - name: kserve-container
          image: quay.io/sara_banderby/kserver-runtime:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MODEL_DIR
              value: /mnt/models
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8080
            periodSeconds: 20
